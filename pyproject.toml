[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: multi-component tests",
    "live: executes real security tools against a live lab target (opt-in via QUARR_LIVE_TARGET; deselected by default)",
]
# `-ra` shows extra test summary info.
# `--timeout` is a safety net: no single test may hang the suite (a denied
# approval / stalled WebSocket previously blocked the run indefinitely).
# `-m 'not live'` keeps the real-tool harness out of the default/CI run.
addopts = "-ra --timeout=60 --timeout-method=thread -m 'not live'"

[tool.coverage.run]
source = ["quarr"]
# NOTE: the large legacy tool modules (mobile/dfir/forensic/blue_team/etc.) are
# intentionally NOT omitted anymore — hiding them made the coverage number
# misleading. They are now measured honestly and count toward the total.
omit = [
    "*/__pycache__/*",
    "*/venv/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
# Ratchet set to the current honest baseline (measured 59%). Raise this as the
# legacy tool modules gain real tests; never lower it to hide a regression.
fail_under = 58

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["venv", "__pycache__", ".kiro"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "venv"
